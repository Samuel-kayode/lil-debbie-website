name: Deploy Frontend to GitHub Pages

on:
  push:
    branches:
      - main
      - arena/924387d2-lil-debbie-website
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build static frontend
        env:
          VITE_SUPABASE_URL: https://jykolicnbfaddbznijtj.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp5a29saWNuYmZhZGRiem5panRqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM4MzkwMjIsImV4cCI6MjEwOTQxNTAyMn0.OUn-TavUKWxVzifqglz5YcBAkFEE_-bLepwuEebeIm4
          VITE_SUPABASE_STORAGE_BUCKET: lil-debbie-media
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
